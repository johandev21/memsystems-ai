name: memsystems

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-superuser}
      POSTGRES_DB: ${POSTGRES_DB:-memsystems}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-memsystems}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: .
      target: backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      # Host is the compose service name, not localhost
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-superuser}@db:5432/${POSTGRES_DB:-memsystems}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me-in-production}
      DEV_STORAGE_DIR: /app/dev-storage
      # Storage URLs must point at the frontend origin so the browser hits nginx,
      # which proxies /api/dev-storage to the backend.
      DEV_STORAGE_PUBLIC_URL: ${DEV_STORAGE_PUBLIC_URL:-http://localhost:3000}
      DEV_STORAGE_TOKEN_SECRET: ${DEV_STORAGE_TOKEN_SECRET:-change-me-in-production}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
    volumes:
      - storage:/app/dev-storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api').then(()=>process.exit(0)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend:
    build:
      context: .
      target: frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional S3-compatible object storage (MinIO).
  # To use it: uncomment this service and set in .env:
  #   S3_ENDPOINT=http://minio:9000
  #   S3_BUCKET=memsystems-bucket
  #   S3_REGION=us-east-1
  #   S3_ACCESS_KEY_ID=minioadmin
  #   S3_SECRET_ACCESS_KEY=minioadmin
  #   S3_FORCE_PATH_STYLE=true
  # minio:
  #   image: minio/minio:latest
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
  #     MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
  #   volumes:
  #     - minio-data:/data
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   healthcheck:
  #     test: ["CMD-SHELL", "mc ready local || exit 1"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5

volumes:
  pgdata:
  storage:
